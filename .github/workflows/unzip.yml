name: Unzip File Automatically

on:
  push:
    paths:
      - '**.zip' # يشتغل التنبيه تلقائياً بمجرد رفع أي ملف مضغوط

jobs:
  unzip-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          unzip -o project.zip -d ./extracted-files
          rm project.zip # اختياري: لحذف الملف المضغوط بعد فكه

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated unzip from GitHub Actions" || exit 0
          git push
